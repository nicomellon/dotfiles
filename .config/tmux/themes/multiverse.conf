# ── Theme (multiverse) ───────────────────────────────────────────────────────
# Palette taken from ~/.config/opencode/themes/multiverse.json
# bg #14171a  panel #181c20  border #4b5158  sel #2d3339  muted #9ba2ab
# fg #f8fafc  fg_dim #d1d6db  rose #f01438  rose_light #ff4d6a
# blue #33bbff  green #00cc66  yellow #ffc200  purple #a455ff
# Drop-in replacement for the theme block in tmux.conf:
#   source-file ~/.config/tmux/themes/multiverse.conf
# NB: keep hex lowercase — inside formats '#D' / '#F' are tmux aliases.

set -g status-position top
set -g status-justify left
set -g status-style 'bg=default,fg=#f8fafc'
set -g status-left-length 40
set -g status-right-length 120

# session pill, turns yellow while the prefix is held
set -g status-left "#[fg=#{?client_prefix,#ffc200,#33bbff},bg=default]#[fg=#14171a,bg=#{?client_prefix,#ffc200,#33bbff},bold] #S#[fg=#{?client_prefix,#ffc200,#33bbff},bg=default,nobold]  "

# agent state per window (set by claude-notify): working / done / waiting
set -g @claude_icon "#{?#{==:#{@claude},working},\U000f06a9,#{?#{==:#{@claude},done},,#{?#{==:#{@claude},waiting},,}}}"
set -g @claude_color "#{?#{==:#{@claude},working},#ffc200,#{?#{==:#{@claude},done},#00cc66,#ff4d6a}}"

set -g window-status-separator ' '
set -g window-status-format "#[fg=#9ba2ab] #I #[fg=#d1d6db]#W#{?window_zoomed_flag, \U000f0293,}#{?#{@claude}, #[fg=#{E:@claude_color}]#{E:@claude_icon},} "
set -g window-status-current-format "#[fg=#f01438,bg=default]#[fg=#ffffff,bg=#f01438,bold]#I #W#{?window_zoomed_flag, \U000f0293,}#{?#{@claude}, #{E:@claude_icon},}#[fg=#f01438,bg=default,nobold]"
# tmux underlines the current window by default; the underline takes the pill cap's rose and sticks out past the padding
set -g window-status-current-style 'none'
set -g window-status-activity-style 'fg=#ffc200'
set -g window-status-bell-style 'fg=#ff4d6a,bold'

# right: finished/waiting agents in *other* sessions, copy-mode flag, clock
set -g status-right "#{S:#{W:#{?#{&&:#{@claude},#{&&:#{!=:#{@claude},working},#{!=:#{session_name},#{client_session}}}},#[fg=#{E:@claude_color}]#{E:@claude_icon} #S:#I  ,}}}#{?pane_in_mode,#[fg=#ffc200] #{pane_mode}  ,}#[fg=#9ba2ab] %H:%M "

# panes
set -g pane-border-lines single
set -g pane-border-style 'fg=#4b5158'
set -g pane-active-border-style 'fg=#f01438'
set -g display-panes-active-colour '#f01438'
set -g display-panes-colour '#9ba2ab'

# messages, copy-mode selection, popups, menus
set -g message-style 'bg=#2d3339,fg=#f8fafc'
set -g message-command-style 'bg=#2d3339,fg=#f8fafc'
set -g mode-style 'bg=#2d3339,fg=#f8fafc'
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#f01438'
set -g menu-border-lines rounded
set -g menu-border-style 'fg=#f01438'
set -g clock-mode-colour '#f01438'
