# ── Theme (tokyonight) ───────────────────────────────────────────────────────
# bg #1a1b26  bg_highlight #3b4261  comment #565f89  fg_dark #a9b1d6
# fg #c0caf5  blue #7aa2f7  magenta #bb9af7  green #9ece6a
# yellow #e0af68  red #f7768e  orange #ff9e64
# NB: keep hex lowercase — inside formats '#D' / '#F' are tmux aliases.

set -g status-position top
set -g status-justify left
set -g status-style 'bg=default,fg=#c0caf5'
set -g status-left-length 40
set -g status-right-length 120

# session pill, turns red while the prefix is held
set -g status-left "#[fg=#{?client_prefix,#f7768e,#7aa2f7},bg=default]#[fg=#1a1b26,bg=#{?client_prefix,#f7768e,#7aa2f7},bold] #S#[fg=#{?client_prefix,#f7768e,#7aa2f7},bg=default,nobold]  "

# agent state per window (set by claude-notify): working / done / waiting
set -g @claude_icon "#{?#{==:#{@claude},working},\U000f06a9,#{?#{==:#{@claude},done},,#{?#{==:#{@claude},waiting},,}}}"
set -g @claude_color "#{?#{==:#{@claude},working},#e0af68,#{?#{==:#{@claude},done},#9ece6a,#f7768e}}"

set -g window-status-separator ' '
set -g window-status-format "#[fg=#565f89] #I #[fg=#a9b1d6]#W#{?window_zoomed_flag, \U000f0293,}#{?#{@claude}, #[fg=#{E:@claude_color}]#{E:@claude_icon},} "
set -g window-status-current-format "#[fg=#bb9af7,bg=default]#[fg=#1a1b26,bg=#bb9af7,bold]#I #W#{?window_zoomed_flag, \U000f0293,}#{?#{@claude}, #{E:@claude_icon},}#[fg=#bb9af7,bg=default,nobold]"
set -g window-status-activity-style 'fg=#ff9e64'
set -g window-status-bell-style 'fg=#f7768e,bold'

# right: finished/waiting agents in *other* sessions, copy-mode flag, clock
set -g status-right "#{S:#{W:#{?#{&&:#{@claude},#{&&:#{!=:#{@claude},working},#{!=:#{session_name},#{client_session}}}},#[fg=#{E:@claude_color}]#{E:@claude_icon} #S:#I  ,}}}#{?pane_in_mode,#[fg=#e0af68] #{pane_mode}  ,}#[fg=#565f89] %H:%M "

# panes
set -g pane-border-lines single
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#bb9af7'
set -g display-panes-active-colour '#bb9af7'
set -g display-panes-colour '#565f89'

# messages, copy-mode selection, popups, menus
set -g message-style 'bg=#3b4261,fg=#c0caf5'
set -g message-command-style 'bg=#3b4261,fg=#c0caf5'
set -g mode-style 'bg=#414868,fg=#c0caf5'
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#bb9af7'
set -g menu-border-lines rounded
set -g menu-border-style 'fg=#bb9af7'
set -g clock-mode-colour '#bb9af7'
