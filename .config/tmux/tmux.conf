# remap prefix from 'C-b' to 'C-Space'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# ── General ────────────────────────────────────────────────────────────────

# true color + undercurl passthrough for ghostty / nvim
set -s default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm,*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g mouse on
set -g focus-events on
set -s escape-time 0
set -g history-limit 50000
set -g display-time 3000
set -g status-interval 5
set -g allow-passthrough on
set -s set-clipboard on
set -s extended-keys on
set -g set-titles on
set -g set-titles-string '#S · #W'

# start windows and panes at 1, keep numbering gapless
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# when a session is killed, jump to another one instead of detaching
set -g detach-on-destroy off

# ── Keys ───────────────────────────────────────────────────────────────────

bind r source-file ~/.config/tmux/tmux.conf \; display 'config reloaded'

# Set new windows to open in current directory
bind c new-window -c "#{pane_current_path}"

# easy-to-remember split pane commands
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind-key -r f display-popup -E -w 60% -h 50% ~/.config/tmux/sessionizer

# Claude agents: jump to the next one needing attention / pick from all of them
bind a run-shell '~/.config/tmux/claude-notify jump "#{client_name}"'
bind A display-popup -E -w 90% -h 80% -b rounded -T ' 󰚩 Claude agents ' "~/.config/tmux/claude-picker '#{client_name}'"

# ── Theme ──────────────────────────────────────────────────────────────────
# available: themes/multiverse.conf, themes/tokyonight.conf
source-file ~/.config/tmux/themes/multiverse.conf

# ── Claude agent notifications ─────────────────────────────────────────────
# a "done" marker is cleared as soon as you look at that window
set-hook -g pane-focus-in[42] 'if -F "#{==:#{@claude},done}" "set -wu @claude"'
set-hook -g after-select-window[42] 'if -F "#{==:#{@claude},done}" "set -wu @claude"'
set-hook -g client-session-changed[42] 'if -F "#{==:#{@claude},done}" "set -wu @claude"'
