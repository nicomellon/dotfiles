# remap prefix from 'C-b' to 'C-Space'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# ── General ────────────────────────────────────────────────────────────────

# true color + undercurl passthrough for ghostty / nvim
set -s default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm,*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g mouse on
set -g focus-events on
set -s escape-time 0
set -g history-limit 50000
set -g display-time 3000
set -g status-interval 5
set -g allow-passthrough on
set -s extended-keys on
set -g set-titles on
set -g set-titles-string '#S · #W'

# start windows and panes at 1, keep numbering gapless
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# when a session is killed, jump to another one instead of detaching
set -g detach-on-destroy off

# ── Keys ───────────────────────────────────────────────────────────────────

bind r source-file ~/.config/tmux/tmux.conf \; display 'config reloaded'

# Set new windows to open in current directory
bind c new-window -c "#{pane_current_path}"

# easy-to-remember split pane commands
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

bind-key -r f display-popup -E -w 60% -h 50% ~/.config/tmux/sessionizer

# Claude agents: jump to the next one needing attention / pick from all of them
bind a run-shell '~/.config/tmux/claude-notify jump "#{client_name}"'
bind A display-popup -E -w 90% -h 80% -b rounded -T ' 󰚩 Claude agents ' "~/.config/tmux/claude-picker '#{client_name}'"

# ── Theme (tokyonight) ───────────────────────────────────────────────────────
# bg #1a1b26  bg_highlight #3b4261  comment #565f89  fg_dark #a9b1d6
# fg #c0caf5  blue #7aa2f7  magenta #bb9af7  green #9ece6a
# yellow #e0af68  red #f7768e  orange #ff9e64
# NB: keep hex lowercase — inside formats '#D' / '#F' are tmux aliases.

set -g status-position top
set -g status-justify left
set -g status-style 'bg=default,fg=#c0caf5'
set -g status-left-length 40
set -g status-right-length 120

# session pill, turns red while the prefix is held
set -g status-left "#[fg=#{?client_prefix,#f7768e,#7aa2f7},bg=default]#[fg=#1a1b26,bg=#{?client_prefix,#f7768e,#7aa2f7},bold] #S#[fg=#{?client_prefix,#f7768e,#7aa2f7},bg=default,nobold]  "

# agent state per window (set by claude-notify): working / done / waiting
set -g @claude_icon "#{?#{==:#{@claude},working},\U000f06a9,#{?#{==:#{@claude},done},,#{?#{==:#{@claude},waiting},,}}}"
set -g @claude_color "#{?#{==:#{@claude},working},#e0af68,#{?#{==:#{@claude},done},#9ece6a,#f7768e}}"

set -g window-status-separator ' '
set -g window-status-format "#[fg=#565f89] #I #[fg=#a9b1d6]#W#{?window_zoomed_flag, \U000f0293,}#{?#{@claude}, #[fg=#{E:@claude_color}]#{E:@claude_icon},} "
set -g window-status-current-format "#[fg=#bb9af7,bg=default]#[fg=#1a1b26,bg=#bb9af7,bold]#I #W#{?window_zoomed_flag, \U000f0293,}#{?#{@claude}, #{E:@claude_icon},}#[fg=#bb9af7,bg=default,nobold]"
set -g window-status-activity-style 'fg=#ff9e64'
set -g window-status-bell-style 'fg=#f7768e,bold'

# right: finished/waiting agents in *other* sessions, copy-mode flag, clock
set -g status-right "#{S:#{W:#{?#{&&:#{@claude},#{&&:#{!=:#{@claude},working},#{!=:#{session_name},#{client_session}}}},#[fg=#{E:@claude_color}]#{E:@claude_icon} #S:#I  ,}}}#{?pane_in_mode,#[fg=#e0af68] #{pane_mode}  ,}#[fg=#565f89] %H:%M "

# panes
set -g pane-border-lines single
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#bb9af7'
set -g display-panes-active-colour '#bb9af7'
set -g display-panes-colour '#565f89'

# messages, copy-mode selection, popups, menus
set -g message-style 'bg=#3b4261,fg=#c0caf5'
set -g message-command-style 'bg=#3b4261,fg=#c0caf5'
set -g mode-style 'bg=#414868,fg=#c0caf5'
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#bb9af7'
set -g menu-border-lines rounded
set -g menu-border-style 'fg=#bb9af7'
set -g clock-mode-colour '#bb9af7'

# ── Claude agent notifications ─────────────────────────────────────────────
# a "done" marker is cleared as soon as you look at that window
set-hook -g pane-focus-in[42] 'if -F "#{==:#{@claude},done}" "set -wu @claude"'
set-hook -g after-select-window[42] 'if -F "#{==:#{@claude},done}" "set -wu @claude"'
set-hook -g client-session-changed[42] 'if -F "#{==:#{@claude},done}" "set -wu @claude"'
